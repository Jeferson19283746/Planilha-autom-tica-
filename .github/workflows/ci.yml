name: Validate Zahav Finance OS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Smoke test server and SPA routes
        run: |
          node server.mjs > /tmp/zahav.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          curl --fail http://127.0.0.1:3000/api/health | grep '"ok":true'
          curl --fail http://127.0.0.1:3000/ | grep 'Zahav Finance OS'
          curl --fail http://127.0.0.1:3000/dashboard | grep 'Zahav Finance OS'
          curl --fail http://127.0.0.1:3000/clientes | grep 'Zahav Finance OS'
          curl --fail http://127.0.0.1:3000/dre | grep 'Zahav Finance OS'
          curl --fail http://127.0.0.1:3000/js/router.js >/dev/null
          curl --fail http://127.0.0.1:3000/js/core.js >/dev/null
          curl --fail http://127.0.0.1:3000/js/cloud.js >/dev/null
          curl --fail http://127.0.0.1:3000/js/runtime.js >/dev/null
